[package]
name = "dwarven-depths-desktop"
version = "0.0.0"
description = "Dwarven Depths desktop packaging evaluation"
authors = ["Dwarven Depths contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "UNLICENSED"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
